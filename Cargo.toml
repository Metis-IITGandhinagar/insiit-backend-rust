[package]
name = "insiit-backend-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
# WARNING Don't update this version, need to follow version that ships with rs-firebase-admin-sdk
# WARNING Don't update this version, need to follow version that ships with rs-firebase-admin-sdk
# WARNING Don't update this version, need to follow version that ships with rs-firebase-admin-sdk
# default-features is off so we reuse the TLS stack rs-firebase-admin-sdk already enables
axum = { version = "0.8.9", features = ["tokio", "macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
base64 = "0.23.0"
dotenvy = "0.15.7"
error-stack = "0.7.1"
google-cloud-auth = "1.13.0"
hex = "0.4.3"
hmac = "0.12.1"
log = "0.4.33"
reqwest = { version = "0.13", features = ["json"], default-features = false }
rs-firebase-admin-sdk = { version = "5.0.0", features = ["tokens"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
simplelog = { version = "0.12.2", features = ["termcolor"] }
sqlx = { version = "0.9.0", features = ["derive", "macros", "time", "postgres", "runtime-tokio"] }
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.53", features = ["serde-well-known", "macros", "formatting", "parsing"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
