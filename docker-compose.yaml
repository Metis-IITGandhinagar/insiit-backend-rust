services:
  app:
    build: .
    ports:
      - "${PORT:?PORT must be set in .env}:${PORT}"
    env_file:
      - .env
    # Lets POSTGRES_URL reach a database running on the host, e.g.
    # postgres://user:pass@host.docker.internal:5432/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - target_data:/app/target

volumes:
  target_data:
